{# Shared UI helpers. Import with: {% from "macros.html" import tip %} #}
{% macro tip(text, aria="More info", width="w-56") -%}
<span class="relative group inline-flex align-middle shrink-0" tabindex="0" title="{{ text }}">
  <span class="inline-flex h-4 w-4 items-center justify-center rounded-full border border-slate-400 text-[10px] font-semibold text-slate-600 cursor-help" aria-label="{{ aria }}">?</span>
  <span role="tooltip" class="pointer-events-none absolute left-1/2 top-full z-20 mt-1 hidden {{ width }} -translate-x-1/2 rounded-md border border-slate-200 bg-white p-2 text-[11px] font-normal text-slate-700 shadow-lg group-hover:block group-focus:block group-focus-within:block normal-case tracking-normal leading-snug">{{ text }}</span>
</span>
{%- endmacro %}
